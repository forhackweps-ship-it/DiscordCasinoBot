name: Discord Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

- name: Deploy Commands
  env:
    TOKEN: ${{ secrets.TOKEN }}
    CLIENT_ID: ${{ secrets.CLIENT_ID }}
  run: npm run deploy
